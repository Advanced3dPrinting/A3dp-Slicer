# A3DP IDEX kit. Cartesian moving-gantry (bed on 4 Z ball screws, NOT CoreXY); dual carriage
# on Y (klipper [dual_carriage] axis:y, IDEX-620_Config/printer.cfg). Bed, machine limits,
# retract and gcode = Rob's own working profile work/A3dp/A3dp slicer/configuration/printer/
# A3dp meter idex.ini (2025-03-03); identical machine limits in his Big60.ini / 1000.ini
# meter-class profiles. Klipper host. Slicer emits T{next_extruder}; T0/T1 park/activate/
# offset macros live in the printer's Dual.cfg (see kit header comment).
# NOTE: does NOT inherit *0.4nozzle* - that preset sets a single nozzle_diameter and would
# clobber the dual-extruder 0.4,0.4 (later parents in the inherits list win).
[printer:*A3dp_IDEX_KIT*]
inherits = *common*
bed_shape = 0x0,1010x0,1010x1010,0x1010
max_print_height = 1000
printer_model = A3dp_IDEX_KIT
nozzle_diameter = 0.4,0.4
extruder_offset = 0x0,0x0
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 6000
machine_max_acceleration_extruding = 10000
machine_max_acceleration_retracting = 10000
machine_max_acceleration_travel = 10000,1250
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_acceleration_z = 360
machine_max_feedrate_e = 100
machine_max_feedrate_x = 800
machine_max_feedrate_y = 800
machine_max_feedrate_z = 20
machine_max_jerk_e = 10
machine_max_jerk_x = 5
machine_max_jerk_y = 5
machine_max_jerk_z = 2
start_gcode = PRINT_START MATERIAL={filament_type[0]} MATERIAL1={filament_type[1]} EXTRUDER_TEMP={first_layer_temperature[0]} EXTRUDER1_TEMP={first_layer_temperature[1]} BED_TEMP={first_layer_bed_temperature[initial_extruder]} CHAMBER_TEMP={chamber_temperature}\nM190 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature_0] T0; set 1st nozzle heater to first layer temperature\nM104 S[first_layer_temperature_1] T1; set 2nd nozzle heater to first layer temperature\nG90\nEUCLID_PROBE_BEGIN_BATCH\nG28\nG32\nEUCLID_PROBE_END_BATCH\nM109 S[first_layer_temperature_0] T0; set 1st nozzle heater to first layer temperature\nM109 S[first_layer_temperature_1] T1; set 2nd nozzle heater to first layer temperature\nBED_MESH_PROFILE LOAD=default\nPRINT_START8\n
end_gcode = PRINT_END\n
toolchange_gcode = T{next_extruder}\n
time_toolchange = 30
retract_before_travel = 2,2
retract_before_wipe = 0%,0%
retract_layer_change = 1,1
retract_length = 0.5,1
retract_length_toolchange = 5,20
retract_lift = 2,0.8
retract_lift_above = 0.2,0.2
retract_lift_before_travel = 2,2
retract_lift_below = 500,500
retract_lift_top = "All surfaces";"All surfaces"
retract_restart_extra = 0,0
retract_restart_extra_toolchange = 0,0
retract_speed = 30,60
deretract_speed = 20,50
wipe = 1,1
wipe_advanced = 0
wipe_advanced_algo = linear
wipe_advanced_multiplier = 60
wipe_advanced_nozzle_melted_volume = 120
wipe_extra_perimeter = 1,0
wipe_inside_depth = 50%,50%
wipe_inside_end = 1,1
wipe_inside_start = 1,0
wipe_lift = 0.2,0
wipe_lift_length = 50%,50%
wipe_min = 150%,150%
wipe_only_crossing = 1,1
wipe_speed = 0,0
default_print_profile = A3dp (.2) Standard res
default_filament_profile = PLA @A3dp
printer_notes = A3DP IDEX kit: dual 0.4 extruders, IDEX dual carriage on Y (T0 front head, T1 independent Y carriage). Bed 1010x1010x1000, machine limits, retract and wipe values from Rob's working profile A3dp meter idex.ini (A3dp-Slicer 2.7.61.0, 2025-03-03, archive work/A3dp/A3dp slicer/configuration/printer/). Start gcode = his meter IDEX sequence (PRINT_START with dual material/temp params, EUCLID_PROBE_BEGIN_BATCH/G28/G32/EUCLID_PROBE_END_BATCH per euclid.cfg, M109 both nozzles, BED_MESH_PROFILE, PRINT_START8); end = PRINT_END; toolchange = T{next_extruder} - T0/T1 macros (PARK_extruder, ACTIVATE_EXTRUDER, SET_DUAL_CARRIAGE, per-tool SET_GCODE_OFFSET) live in machine Dual.cfg (IDEX-620_Config_221217 2022-12; config-20250207 2025-01 adds homed-axes guards + per-tool SET_INPUT_SHAPER). PRINT_START8/PRINT_END macros verified in work/A3dp/Takoto/big meter/webui_macrosmeter.cfg. Machine-specific extras NOT copied: before_layer TIMELAPSE_TAKE_FRAME macro, per-carriage fan macros (FAN_VARIABLE/CARRIAGE_PRINT_FAN).\n

