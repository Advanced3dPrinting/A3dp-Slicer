# A3DP IDEX kit (2026-11, kanban t_89f7e700): wired to Rob's field data from the OneDrive
# archive 2026-11-11. Slicer-side values from his own working A3dp-Slicer profile
# work/A3dp/A3dp slicer/configuration/printer/A3dp meter idex.ini (2.7.61.0, 2025-03-03).
# Toolchange T0/T1 + park macros live on the machines in klipper Dual.cfg
# (work/A3dp/IDEX Modix/IDEX-620_Config_221217/IDEX-620_Config/Dual.cfg, 2022-12;
# personal/Downloads/config-20250207-163406/klipper_config/Dual.cfg, 2025-01, adds
# homed-axes guards + per-tool input shaper). PRINT_START8 prime + PRINT_END park macros
# verified in work/A3dp/Takoto/big meter/webui_macrosmeter.cfg.
[printer_model:A3dp_IDEX_KIT]
name = A3DP IDEX Kit (Big-Meter class)
variants = 0.4
technology = FFF
family = Servo
default_materials = PLA @A3dp; PETG PET @A3dp; KVP ABS @A3dp
thumbnail = Transparentthumb.png

